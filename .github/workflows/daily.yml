name: Daily snapshot

# Fetches the previous trading day's ASX 24 settlements, logs model and market
# probabilities for the next RBA meeting, marks open trades, and commits the
# result. The commit timestamp is the public record that nothing was backfilled.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC Mon-Fri = about 7:30am Sydney, Tue-Sat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps https://github.com/robcambridge/aus-gdp-nowcast/archive/f2a072959c8b2e3d5ce2ac507c58b5584b73efae.zip
      - name: Update
        run: python -m rbaengine update
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output SCORECARD.md
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push
